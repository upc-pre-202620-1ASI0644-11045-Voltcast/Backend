# Adds the worker to the local stack and shares the uploaded files and the task queues with the API:
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml run --rm worker etl
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml run --rm worker notifications  (run it on a schedule)
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml run --rm worker onedrive  (once a day)
services:
  backend:
    environment:
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - storage_data:/data/storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: ["worker"]
    command: ["etl"]
    environment:
      DATABASE_URL: mysql+aiomysql://root:root@db:3306/tp1
      LOCAL_STORAGE_DIR: /data/storage
      # only `notifications` sends email and push
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      # only `onedrive` (once a day) talks to Microsoft
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-consumers}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      ONEDRIVE_FOLDER: ${ONEDRIVE_FOLDER:-/VoltCast/datasets}
    volumes:
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  storage_data:
