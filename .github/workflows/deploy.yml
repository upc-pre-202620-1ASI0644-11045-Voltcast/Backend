name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  RESOURCE_GROUP: rg-voltcast
  REGISTRY: acrvoltcast202620029
  APP_SERVICE: app-service-voltcast-202620029

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest

  deploy:
    # Only what lands in main (production) is built and published.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # lets the job ask Azure for a token with the managed identity
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built inside ACR, so the runner does not need Docker nor the 1.9 GB worker image.
      - name: Build the API and worker images
        run: |
          az acr build -r $REGISTRY -t backend:${GITHUB_SHA::7} -t backend:latest -f Dockerfile .
          az acr build -r $REGISTRY -t worker:${GITHUB_SHA::7} -t worker:latest -f Dockerfile.worker .

      - name: Deploy the API
        run: |
          az webapp config container set -g $RESOURCE_GROUP -n $APP_SERVICE \
            --container-image-name $REGISTRY.azurecr.io/backend:${GITHUB_SHA::7}
          az webapp restart -g $RESOURCE_GROUP -n $APP_SERVICE

      - name: Deploy the Jobs
        run: |
          for job in job-voltcast-etl job-voltcast-training; do
            az containerapp job update -g $RESOURCE_GROUP -n $job --image $REGISTRY.azurecr.io/worker:${GITHUB_SHA::7}
          done
