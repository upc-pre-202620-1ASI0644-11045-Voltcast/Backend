name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  RESOURCE_GROUP: rg-voltcast
  REGISTRY: acrvoltcast202620029
  APP_SERVICE: app-service-voltcast-202620029

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest

  deploy:
    # Only what lands in main (production) is built and published.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # lets the job ask Azure for a token with the managed identity
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built inside ACR, so the runner does not need Docker nor the 1.9 GB worker image.
      - name: Build the API and worker images
        run: |
          az acr build -r $REGISTRY -t backend:${GITHUB_SHA::7} -t backend:latest -f Dockerfile .
          az acr build -r $REGISTRY -t worker:${GITHUB_SHA::7} -t worker:latest -f Dockerfile.worker .

      - name: Deploy the API
        run: |
          az webapp config container set -g $RESOURCE_GROUP -n $APP_SERVICE \
            --container-image-name $REGISTRY.azurecr.io/backend:${GITHUB_SHA::7}
          az webapp restart -g $RESOURCE_GROUP -n $APP_SERVICE

      # Runs on every deploy and is safe to repeat. The Job that sends the notifications is created on the first run and
      # takes its database and SMTP settings from the API's App Service, so nothing is typed by hand. It reuses the environment, the
      # workload profile and the registry login of the ETL Job. Failed runs while MySQL is stopped are expected.
      - name: Ensure the notifications Job
        run: |
          set -euo pipefail
          job=job-voltcast-notifications
          image=$REGISTRY.azurecr.io/worker:${GITHUB_SHA::7}

          settings=$(az webapp config appsettings list -g $RESOURCE_GROUP -n $APP_SERVICE -o json)
          get() { echo "$settings" | jq -r --arg n "$1" '.[] | select(.name == $n) | .value'; }
          for name in DATABASE_URL SMTP_USER SMTP_PASS SMTP_FROM; do
            echo "::add-mask::$(get $name)"
          done

          env_vars=(
            DATABASE_URL=secretref:database-url SMTP_PASS=secretref:smtp-pass
            "DB_SSL=$(get DB_SSL)" "SMTP_HOST=$(get SMTP_HOST)" "SMTP_PORT=$(get SMTP_PORT)"
            "SMTP_USER=$(get SMTP_USER)" "SMTP_FROM=$(get SMTP_FROM)"
          )
          secrets=("database-url=$(get DATABASE_URL)" "smtp-pass=$(get SMTP_PASS)")
          # Push notifications: the Firebase service account, once it is set in the App Service (one line of JSON)
          firebase=$(get FIREBASE_CREDENTIALS_JSON)
          if [ -n "$firebase" ]; then
            echo "::add-mask::$firebase"
            secrets+=("firebase-credentials=$firebase")
            env_vars+=(FIREBASE_CREDENTIALS_JSON=secretref:firebase-credentials)
            # The training Job pushes the alerts it creates right after publishing the model
            az containerapp job secret set -g $RESOURCE_GROUP -n job-voltcast-training --secrets "firebase-credentials=$firebase" -o none
            az containerapp job update -g $RESOURCE_GROUP -n job-voltcast-training \
              --set-env-vars FIREBASE_CREDENTIALS_JSON=secretref:firebase-credentials -o none
          fi

          if az containerapp job show -g $RESOURCE_GROUP -n $job -o none 2>/dev/null; then
            az containerapp job secret set -g $RESOURCE_GROUP -n $job --secrets "${secrets[@]}" -o none
            az containerapp job update -g $RESOURCE_GROUP -n $job --set-env-vars "${env_vars[@]}" -o none
            exit 0
          fi

          environment=$(az containerapp job show -g $RESOURCE_GROUP -n job-voltcast-etl --query properties.environmentId -o tsv)
          profile=$(az containerapp job show -g $RESOURCE_GROUP -n job-voltcast-etl --query properties.workloadProfileName -o tsv)
          extra=()
          if [ -n "$profile" ] && [ "$profile" != "None" ]; then extra+=(--workload-profile-name "$profile"); fi
          # Same registry login as the ETL Job, which already pulls from ACR: its password (read from its secret) or its identity.
          registry=$(az containerapp job show -g $RESOURCE_GROUP -n job-voltcast-etl --query "properties.configuration.registries[0]" -o json)
          server=$(echo "$registry" | jq -r '.server')
          username=$(echo "$registry" | jq -r '.username // empty')
          identity=$(echo "$registry" | jq -r '.identity // empty')
          if [ -n "$username" ]; then
            password=$(az containerapp job secret show -g $RESOURCE_GROUP -n job-voltcast-etl \
              --secret-name "$(echo "$registry" | jq -r '.passwordSecretRef')" --query value -o tsv)
            echo "::add-mask::$password"
            login=(--registry-username "$username" --registry-password "$password")
          elif [ -n "$identity" ] && [ "$identity" != system ]; then
            login=(--mi-user-assigned "$identity" --registry-identity "$identity")
          else
            echo "The ETL Job pulls with a system identity: create $job by hand and give it the AcrPull role" >&2
            exit 1
          fi

          # Creating Jobs with the CLI sometimes times out on the server: delete the half-made one and try once more.
          for attempt in 1 2; do
            if az containerapp job create -g $RESOURCE_GROUP -n $job --environment "$environment" "${extra[@]}" \
                 --trigger-type Schedule --cron-expression "0 */12 * * *" --replica-timeout 300 --replica-retry-limit 1 \
                 --cpu 0.5 --memory 1Gi --image $image --args notifications \
                 --registry-server "$server" "${login[@]}" \
                 --secrets "${secrets[@]}" --env-vars "${env_vars[@]}" -o none; then
              exit 0
            fi
            az containerapp job delete -g $RESOURCE_GROUP -n $job --yes -o none 2>/dev/null || true
            sleep 15
          done
          echo "Could not create $job" >&2
          exit 1

      # Once a day (08:00 UTC, 03:00 in Peru): brings the Excel files of the company's Drive. Created only when the App Service
      # already has the Google settings (GOOGLE_*, TOKEN_ENCRYPTION_KEY), so deploying before the Google Cloud setup still works.
      # It reads and writes the same database, blob container and queues as the API.
      - name: Ensure the Drive Job
        run: |
          set -euo pipefail
          job=job-voltcast-drive
          image=$REGISTRY.azurecr.io/worker:${GITHUB_SHA::7}

          settings=$(az webapp config appsettings list -g $RESOURCE_GROUP -n $APP_SERVICE -o json)
          get() { echo "$settings" | jq -r --arg n "$1" '.[] | select(.name == $n) | .value'; }
          if [ -z "$(get GOOGLE_CLIENT_ID)" ] || [ -z "$(get TOKEN_ENCRYPTION_KEY)" ]; then
            echo "The Google settings are not in the App Service yet: the Drive Job is not created"
            exit 0
          fi
          for name in DATABASE_URL GOOGLE_CLIENT_SECRET TOKEN_ENCRYPTION_KEY AZURE_STORAGE_CONNECTION_STRING; do
            echo "::add-mask::$(get $name)"
          done

          env_vars=(
            DATABASE_URL=secretref:database-url GOOGLE_CLIENT_SECRET=secretref:google-client-secret
            TOKEN_ENCRYPTION_KEY=secretref:token-encryption-key AZURE_STORAGE_CONNECTION_STRING=secretref:storage-connection
            "DB_SSL=$(get DB_SSL)" "GOOGLE_CLIENT_ID=$(get GOOGLE_CLIENT_ID)" "GOOGLE_REDIRECT_URI=$(get GOOGLE_REDIRECT_URI)"
            "GOOGLE_DRIVE_FOLDER_ID=$(get GOOGLE_DRIVE_FOLDER_ID)" "AZURE_STORAGE_CONTAINER=$(get AZURE_STORAGE_CONTAINER)"
          )
          secrets=(
            "database-url=$(get DATABASE_URL)" "google-client-secret=$(get GOOGLE_CLIENT_SECRET)"
            "token-encryption-key=$(get TOKEN_ENCRYPTION_KEY)" "storage-connection=$(get AZURE_STORAGE_CONNECTION_STRING)"
          )

          if az containerapp job show -g $RESOURCE_GROUP -n $job -o none 2>/dev/null; then
            az containerapp job secret set -g $RESOURCE_GROUP -n $job --secrets "${secrets[@]}" -o none
            az containerapp job update -g $RESOURCE_GROUP -n $job --set-env-vars "${env_vars[@]}" -o none
            exit 0
          fi

          environment=$(az containerapp job show -g $RESOURCE_GROUP -n job-voltcast-etl --query properties.environmentId -o tsv)
          profile=$(az containerapp job show -g $RESOURCE_GROUP -n job-voltcast-etl --query properties.workloadProfileName -o tsv)
          extra=()
          if [ -n "$profile" ] && [ "$profile" != "None" ]; then extra+=(--workload-profile-name "$profile"); fi
          registry=$(az containerapp job show -g $RESOURCE_GROUP -n job-voltcast-etl --query "properties.configuration.registries[0]" -o json)
          server=$(echo "$registry" | jq -r '.server')
          username=$(echo "$registry" | jq -r '.username // empty')
          identity=$(echo "$registry" | jq -r '.identity // empty')
          if [ -n "$username" ]; then
            password=$(az containerapp job secret show -g $RESOURCE_GROUP -n job-voltcast-etl \
              --secret-name "$(echo "$registry" | jq -r '.passwordSecretRef')" --query value -o tsv)
            echo "::add-mask::$password"
            login=(--registry-username "$username" --registry-password "$password")
          elif [ -n "$identity" ] && [ "$identity" != system ]; then
            login=(--mi-user-assigned "$identity" --registry-identity "$identity")
          else
            echo "The ETL Job pulls with a system identity: create $job by hand and give it the AcrPull role" >&2
            exit 1
          fi

          # Reading a big workbook takes memory and time: 2 Gi and 30 minutes.
          for attempt in 1 2; do
            if az containerapp job create -g $RESOURCE_GROUP -n $job --environment "$environment" "${extra[@]}" \
                 --trigger-type Schedule --cron-expression "0 8 * * *" --replica-timeout 1800 --replica-retry-limit 1 \
                 --cpu 1 --memory 2Gi --image $image --args drive \
                 --registry-server "$server" "${login[@]}" \
                 --secrets "${secrets[@]}" --env-vars "${env_vars[@]}" -o none; then
              exit 0
            fi
            az containerapp job delete -g $RESOURCE_GROUP -n $job --yes -o none 2>/dev/null || true
            sleep 15
          done
          echo "Could not create $job" >&2
          exit 1

      - name: Deploy the Jobs
        run: |
          jobs=(job-voltcast-etl job-voltcast-training job-voltcast-notifications)
          # The Drive Job only exists once the Google settings are in the App Service
          if az containerapp job show -g $RESOURCE_GROUP -n job-voltcast-drive -o none 2>/dev/null; then jobs+=(job-voltcast-drive); fi
          for job in "${jobs[@]}"; do
            az containerapp job update -g $RESOURCE_GROUP -n $job --image $REGISTRY.azurecr.io/worker:${GITHUB_SHA::7}
          done
